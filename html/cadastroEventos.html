<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de evento</title>
    <link rel="stylesheet" href="../css/cadastroEventos.css">
</head>

<body>

    <header>
        <img class="logo" src="../img/logo-png.png">

        <nav>
            <a href="cadastroPalestrantes.html">Cadastro de Palestrantes</a>
            <a href="cadastroEventos.html">Cadastro de Evento</a>
            <a href="eventos.html">Gerenciador de Evento</a>
        </nav>
    </header>

    <section class="card-cadastro">

        <h3 class="title">Cadastro de Evento</h3>

        <form id="formEvento" class="formulario">

            <label for="nome">Nome</label>
            <br>
            <input type="text" id="nome" name="nome" required>

            <label for="descricao">Descrição</label>
            <br>
            <input type="text" id="descricao" name="descricao" required>

            <label for="local">Local</label>
            <br>
            <input type="text" id="local" name="local" required>

            <label for="palestrante">Palestrante</label>
            <br>
            <select id="palestrante" name="palestrante" required>
                <option value="">Selecione um palestrante</option>
            </select>

            <button type="submit">Cadastrar</button>

        </form>

    </section>

    <script src="../js/cadastroEventos.js"></script>

</body>

</html>
